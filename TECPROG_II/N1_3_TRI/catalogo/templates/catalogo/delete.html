{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Apagar Bolo</title>
    <link rel="stylesheet" href="{% static 'catalogo/style.css' %}">
</head>
<body>
    <h1>Tem certeza que deseja apagar "{{ bolo.nome }}"?</h1>
    <p>Esta ação não pode ser desfeita.</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit">Sim, quero apagar</button>
        <a href="{% url 'catalogo:bolo_detalhe' bolo.pk %}">Cancelar</a>
    </form>
</body>
</html>
