
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Jogo</title>
</head>
<body>
    <h1>Cadastro de Jogo</h1>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Salvar</button>
    </form>

    <a href="{% url 'jogos:dashboard' %}">Voltar ao dashboard</a>
</body>
</html>
